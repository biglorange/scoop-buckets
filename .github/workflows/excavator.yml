name: Excavator

on:
  workflow_dispatch:
  schedule:
    # UTC 18:00 = 北京时间凌晨 02:00
    - cron: '0 18 * * *'

concurrency:
  group: excavator
  cancel-in-progress: false

jobs:
  excavator:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process -Force
          Invoke-RestMethod -Uri 'https://get.scoop.sh' -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\scoop\shims"

      - name: Update manifests
        shell: pwsh
        run: |
          git config core.autocrlf false
          & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" -App '*' -Dir "$PWD/bucket" -Update -ThrowError
          git diff --text

      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add bucket
          $changes = git status --porcelain
          if ($changes) {
              git commit -m 'checkver: auto-update manifests'
              git push
          } else {
              Write-Host 'No changes detected'
          }
